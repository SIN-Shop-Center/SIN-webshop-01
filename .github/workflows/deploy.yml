name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_PRODUCTION to authorize a production deployment'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

# To require manual approval before deploying, configure protection rules
# for the "production" environment in GitHub repo settings:
#   Settings → Environments → production → Required reviewers
# Then uncomment the environment block below:
#
# jobs:
#   deploy:
#     environment:
#       name: production
#       # required_reviewers is set in GitHub UI, not here

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      deployed: ${{ steps.cloudflare_deploy.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cf
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          WEB_PRODUCTION_ENV_FALLBACK_URL: https://shopsin.delqhi.com
      - name: Diagnose Cloudflare token and R2 access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERIFY=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN")
          STATUS=$(echo "$VERIFY" | jq -r '.result.status // .success')
          echo "Token status: $STATUS"
          if [ "$STATUS" != "active" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not active: $(echo "$VERIFY" | jq -c '.errors')"
            exit 1
          fi
          PERMS=$(echo "$VERIFY" | jq -r '[.result.scopes[]?.permissions | to_entries[].key] | unique | join(", ") // "unknown"')
          echo "Token permissions: $PERMS"
          ACCOUNTS=$(curl -s https://api.cloudflare.com/client/v4/accounts \
            -H "Authorization: Bearer $CF_TOKEN" \
            | jq -r '[.result[].id] | join(", ")')
          echo "Token sees accounts: $ACCOUNTS"
          if ! echo "$ACCOUNTS" | grep -q "$CF_ACCOUNT"; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID ($CF_ACCOUNT) is not reachable with this token"
            exit 1
          fi
          BUCKETS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | jq -r '.success, (.errors | tostring)')
          echo "R2 list success: $(echo "$BUCKETS" | head -1)"
          echo "R2 list errors: $(echo "$BUCKETS" | tail -1)"
      - id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://shopsin.delqhi.com/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "::error::Smoke test failed after 5 attempts"
          exit 1

  rollback:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' && needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rollback to previous deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback
      - name: Verify rollback
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://shopsin.delqhi.com/ || true)
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Rollback deployed but site returned HTTP $STATUS"
          else
            echo "Rollback verified (HTTP 200)"
          fi

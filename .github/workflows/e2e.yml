name: E2E Tests

on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated Supabase
        shell: bash
        run: |
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          if ! pnpm db:local:start >"$log_file" 2>&1; then
            echo "Local Supabase failed to start; redacted diagnostics follow." >&2
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#<redacted-database-url>#g' \
              -e 's#(sb_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+)#<redacted-local-token>#g' \
              "$log_file" >&2
            exit 1
          fi
      - name: Run E2E against production build
        run: CI=true E2E_USE_PRODUCTION=true pnpm test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase
        if: always()
        run: pnpm db:local:stop
